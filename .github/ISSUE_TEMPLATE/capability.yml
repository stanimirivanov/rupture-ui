name: UI capability
description: Propose one reviewable Rupture UI behavior
title: ''
labels:
  - ui
body:
  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: Use the existing Rupture milestone that owns this behavior.
      placeholder: M01 - Verified foundation
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: Describe the problem and observable result.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State included behavior and boundaries.
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Design decisions
      description: Record assumptions, contracts, compatibility effects, and ADRs.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include behavior, failures, accessibility, and verification evidence.
      placeholder: '- [ ] ...'
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope
      description: State deliberate exclusions and deferred work.
    validations:
      required: true
